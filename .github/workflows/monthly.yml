# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Monthly builds

on:
  schedule:
    - cron: '0 3 2 * *'  # Each second day of each month at 3h00, MIN HOUR DAY_IN_MONTH MONTH WEEK_DAY

  workflow_dispatch:
    inputs:
      BRANCH:
        description: 'Branch to build'
        required: true
        default: 'medInria6.0.x' # TODO medInria6.0.x aims at be released on master, for now for testing purposes compiles medInria6.0.x as in weekly
        type: string
      RELEASE:
        description: 'Github release tag to send to'
        required: true
        default: 'V6.0.0'
        type: string

jobs:
  build-linux:
    uses: ./.github/workflows/medinria-linux.yml
    with:
      BRANCH:  ${{ inputs.BRANCH || 'medInria6.0.x' }}
      RELEASE: ${{ inputs.BRANCH || 'V6.0.0' }}
    secrets: inherit

  build-linux-realtime:
    uses: ./.github/workflows/medinria-linux.yml
    with:
      BRANCH:  ${{ inputs.BRANCH || 'medInria6.0.x' }}
      RELEASE: ${{ inputs.BRANCH || 'V6.0.0' }}
    secrets: inherit

  build-macos:
    uses: ./.github/workflows/medinria-macos.yml
    with:
      BRANCH:  ${{ inputs.BRANCH || 'medInria6.0.x' }}
      RELEASE: ${{ inputs.BRANCH || 'V6.0.0' }}
    secrets: inherit

  build-windows:
    uses: ./.github/workflows/medinria-windows.yml
    with:
      BRANCH:  ${{ inputs.BRANCH || 'medInria6.0.x' }}
      RELEASE: ${{ inputs.BRANCH || 'V6.0.0' }}
    secrets: inherit
